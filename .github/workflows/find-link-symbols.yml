name: Find undefined symbols in OPPO source

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Clone oppo
        run: |
          git clone --depth 1 -b oneplus/sm8350v_15.0.0_oneplus9pro \
            https://github.com/JackA1ltman/android_kernel_oppo_sm8350.git /tmp/oppo
      - name: Grep symbol definitions
        run: |
          echo "=== bpf_prog_test_run_raw_tp ==="
          grep -rn "bpf_prog_test_run_raw_tp" /tmp/oppo --include="*.c" --include="*.h" -l | head -5
          echo ""
          echo "=== bpf_prog_test_run_tracing ==="
          grep -rn "bpf_prog_test_run_tracing" /tmp/oppo --include="*.c" --include="*.h" -l | head -5
          echo ""
          echo "=== ns_match 定义 ==="
          grep -rn "bool ns_match\|int ns_match" /tmp/oppo --include="*.c" | head -5
          echo ""
          echo "=== bpf_get_prog_name 定义 ==="
          grep -rn "bpf_get_prog_name" /tmp/oppo --include="*.c" -l | head -5
          echo ""
          echo "=== net/bpf 目录 ==="
          ls /tmp/oppo/net/bpf/ 2>/dev/null || echo "net/bpf 不存在"
          echo ""
          echo "=== 厂商树 net/bpf 目录 ==="
          echo "(checking vendor separately)"
