name: Build 9RT Kernel - BPF 5.10 Backported

on:
  workflow_dispatch:

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"

jobs:
  build:
    name: 9RT ColorOS16 + BPF 5.10 (AK3 output)
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 squashfs-tools schedtool dpkg-dev make maven libssl-dev pwgen bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio coccinelle zstd p7zip p7zip-full python3
          curl -C - -L http://launchpadlibrarian.net/580830584/libtinfo5_6.3-2_amd64.deb -o libtinfo5.deb && sudo apt install -y ./libtinfo5.deb && rm -f libtinfo5.deb

      - name: Get build tools
        run: |
          cd $GITHUB_WORKSPACE
          git clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git" -b "android12L-release" gcc-64 --depth=1
          git clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git" -b "android12L-release" gcc-32 --depth=1
          git clone "https://github.com/prorooter007/android_prebuilts_clang_host_linux-x86_clang-6877366.git" -b "11.0" "clang-custom" --depth 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-bpf510
          max-size: 2G

      - name: Get Kernel + modules
        run: |
          cd $GITHUB_WORKSPACE
          git clone -b "oneplus/sm8350_b_16.0.0_oneplus9rt" "https://github.com/JackA1ltman/android_kernel_oneplus_sm8350.git" kernel/msm-5.4 --depth 1
          git clone -b "oneplus/sm8350_b_16.0.0_oneplus9rt" "https://github.com/JackA1ltman/android_kernel_modules_and_devicetree_oneplus_sm8350.git" modules --depth 1
          mv modules/vendor ./
          rm -rf modules

      - name: Get PixelOS reference (BPF 5.10 source)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 -b sixteen-qpr2 \
            "https://github.com/one899/android_kernel_oneplus_sm8350_pixelos.git" /tmp/pixelos

      - name: Sync BPF 5.10 files into vendor tree (铁律范围)
        run: |
          set -e
          P=/tmp/pixelos
          V=$GITHUB_WORKSPACE/kernel/msm-5.4

          echo "=== 备份厂商独有文件 ==="
          mkdir -p /tmp/vendor-only
          for f in $(diff -rq $V/kernel/bpf $P/kernel/bpf 2>/dev/null | grep "Only in $V" | awk '{print $4}' || true); do
            echo "backup: $f"
            cp "$V/kernel/bpf/$f" /tmp/vendor-only/ 2>/dev/null || true
          done

          echo "=== 替换 kernel/bpf ==="
          rm -rf $V/kernel/bpf
          cp -r $P/kernel/bpf $V/kernel/bpf
          for f in /tmp/vendor-only/*; do
            [ -f "$f" ] && cp "$f" "$V/kernel/bpf/" && echo "restored: $(basename $f)"
          done

          echo "=== 同步单文件 ==="
          for f in kernel/trace/bpf_trace.c net/core/filter.c \
                   include/linux/bpf.h include/linux/bpf_verifier.h include/linux/bpf_types.h \
                   include/linux/bpf_local_storage.h include/linux/bpf_lsm.h include/linux/bpf_ringbuf.h \
                   include/linux/bpf_trace.h include/linux/btf.h include/linux/filter.h \
                   include/uapi/linux/bpf.h include/uapi/linux/btf.h \
                   include/linux/capability.h include/uapi/linux/capability.h \
                   include/linux/perf_event.h include/linux/ftrace.h include/linux/trace_events.h \
                   include/linux/security.h include/linux/lsm_hooks.h \
                   include/linux/static_call.h include/linux/bpf-cgroup.h include/linux/cgroup-defs.h \
                   include/linux/cgroup.h include/linux/cgroup_api.h \
                   include/linux/kernfs.h include/linux/fs.h include/linux/fsnotify.h \
                   include/linux/sockptr.h include/linux/bpf_lsm.h include/linux/irq_work.h \
                   include/linux/sched/mm.h include/linux/sched/task.h include/linux/uidgid.h \
                   security/selinux/include/classmap.h security/selinux/include/initial_sid_to_string.h; do
            if [ -f "$P/$f" ]; then
              mkdir -p "$V/$(dirname $f)"
              cp "$P/$f" "$V/$f"
              echo "synced: $f"
            else
              echo "SKIP (not in pixelos): $f"
            fi
          done

          echo "=== 验证 ==="
          cd $V
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          echo "BPF helpers: $(grep -c 'FN(' include/uapi/linux/bpf.h)"
          ls kernel/bpf/ringbuf.c kernel/bpf/trampoline.c kernel/bpf/bpf_iter.c 2>&1

      - name: Enable BPF Kconfig options
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          # 确保 BPF 子系统配置开启
          for opt in CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_HAVE_EBPF_JIT CONFIG_BPF_EVENTS CONFIG_BPF_TRACING CONFIG_BPF_LSM CONFIG_DEBUG_INFO_BTF; do
            grep -q "^$opt=" arch/arm64/configs/9rt_defconfig || echo "$opt=y" >> arch/arm64/configs/9rt_defconfig
            echo "checked: $opt"
          done

      - name: Get Packing Tools
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          git clone "https://github.com/osm0sis/AnyKernel3.git" -b "master" Anykernel3 --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          make CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=oneplus LLVM=1 LLVM_IAS=1 CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- 9rt_defconfig
          make -j$(nproc --all) CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=oneplus LLVM=1 LLVM_IAS=1 STRIP=llvm-strip CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- O=out ARCH=arm64 2>&1 | tee error.log || true
          echo "=== 收集全部编译错误 ==="
          grep -E "error:|Error [0-9]|fatal error|implicit declaration|No rule to make|undefined reference|multiple definition" error.log | sort -u | head -100 || echo "无错误"
          echo "=== Image 是否存在 ==="
          ls -la out/arch/arm64/boot/Image 2>/dev/null || echo "Image 未生成(编译失败)"
          echo "=== 继续打包流程(若失败会在这里失败) ==="
          test -f out/arch/arm64/boot/Image || exit 1
          cat $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/dts/vendor/oplus/martini/*.dtb > $GITHUB_WORKSPACE/kernel/msm-5.4/out/arch/arm64/boot/dts/vendor/oplus/martini/dtb

      - name: Make Anykernel3 - NoDTB
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")
          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh
          mkdir -p tmp
          cp -fp out/arch/arm64/boot/Image tmp
          cp -rp ./Anykernel3/* tmp
          cd tmp && 7za a -mx9 tmp.zip * > /dev/null && cd ..
          cp -fp tmp/tmp.zip oneplus9rt-coloros16-bpf510-$TIME.zip
          rm -rf tmp
          echo "PACK_NAME=oneplus9rt-coloros16-bpf510-$TIME.zip" >> $GITHUB_ENV

      - name: Make Anykernel3 - DTB
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")
          cd $GITHUB_WORKSPACE/kernel/msm-5.4
          mkdir -p tmp
          cp -fp out/arch/arm64/boot/Image tmp
          cp -fp out/arch/arm64/boot/dts/vendor/oplus/martini/dtb tmp
          cp -fp out/arch/arm64/boot/dts/vendor/oplus/martini/dtbo.img tmp
          cp -rp ./Anykernel3/* tmp
          cd tmp && 7za a -mx9 tmp.zip * > /dev/null && cd ..
          cp -fp tmp/tmp.zip oneplus9rt-coloros16-bpf510-$TIME-DTB.zip
          rm -rf tmp
          echo "PACK_NAME_DTB=oneplus9rt-coloros16-bpf510-$TIME-DTB.zip" >> $GITHUB_ENV

      - name: Upload Build Artifacts (AK3)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-9RT-BPF510-AK3
          path: |
            kernel/msm-5.4/${{ env.PACK_NAME }}
            kernel/msm-5.4/${{ env.PACK_NAME_DTB }}
          if-no-files-found: error
